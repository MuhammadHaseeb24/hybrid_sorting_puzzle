name: sortify
description: Sortify - Professional Hybrid Sorting Puzzle Game 2026
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  confetti: ^0.7.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  audioplayers: ^5.2.1
  flutter_sound: ^9.30.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0F0F1A"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21